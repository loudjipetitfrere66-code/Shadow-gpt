<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOW GPT</title>

<style>
body {
  margin: 0;
  background: #080b14;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #111827;
  padding: 20px;
  text-align: center;
  color: #00eaff;
  font-size: 25px;
  font-weight: bold;
}
#chat {
  height: 70vh;
  overflow-y: auto;
  padding: 15px;
}
.message {
  background: #172033;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
}
.user {
  background: #063b4b;
  text-align: right;
}
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #111827;
  padding: 10px;
  box-sizing: border-box;
}
input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  outline: none;
}
button {
  background: #00cfe8;
  border: none;
  padding: 12px;
  margin-left: 8px;
  border-radius: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>🤖 SHADOW GPT</header>

<div id="chat">
  <div class="message">
    Bonjou! Mwen se SHADOW GPT. Kijan mwen ka ede w?
  </div>
</div>

<footer>
  <input id="message" placeholder="Ekri yon mesaj...">
  <button onclick="sendMessage()">VOYE</button>
</footer>

<script>
function sendMessage() {
  let input = document.getElementById("message");
  let chat = document.getElementById("chat");
  let text = input.value.trim();

  if (text === "") return;

  chat.innerHTML +=
    `<div class="message user"></div>`;

  chat.lastElementChild.textContent = text;

  input.value = "";

  chat.innerHTML +=
    `<div class="message">Mwen resevwa mesaj ou! 🤖</div>`;

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
